name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  # Dry run for the release path. publish-release is otherwise reachable only by pushing a
  # `v*` tag, which publishes to Maven Central — so every change to it would ship
  # unexercised. A dispatch runs the version gate and the full test/build path; publish-release
  # stays gated on an actual tag ref, so nothing is published.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version to dry-run the gate against, e.g. v0.9.3. Publishes NOTHING.'
        required: true
        type: string

jobs:
  # Catch version drift at commit time, not at release time.
  #
  # This repo declares its version in two places — build.gradle.kts and SelfTest.kt's
  # SDK_VERSION, which is what the cross-SDK gauntlet's coherence gate reads out of
  # kotlin-results.json. With no expected version the script asserts only that they agree
  # with each other; on a tag or dispatch it also asserts they equal the requested version.
  version:
    name: version consistency
    runs-on: ubuntu-latest
    steps:
      # persist-credentials: false (2026-08) — nothing here pushes; a kept token is readable from .git/config.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Declared versions agree (and match the tag, when there is one)
        # DISPATCH_TAG arrives via env, never interpolated into the shell text
        # (workflow-injection hygiene).
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          EXPECTED=""
          case "$GITHUB_REF" in
            refs/tags/*) EXPECTED="${GITHUB_REF#refs/tags/}" ;;
          esac
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            EXPECTED="$DISPATCH_TAG"
          fi
          bash .github/scripts/check-version.sh "$EXPECTED"

  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        java: [17, 21]
    
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
    
    - name: Set up JDK ${{ matrix.java }}
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6  # v6.0.1
      with:
        java-version: ${{ matrix.java }}
        distribution: 'temurin'
    
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb  # v6.3.0
    
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      if: runner.os != 'Windows'
    
    - name: Run tests
      run: ./gradlew test --no-daemon
    
    - name: Generate test report
      run: ./gradlew jacocoTestReport --no-daemon
      if: success() || failure()
    
    - name: Upload test results
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      if: success() || failure()
      with:
        name: test-results-${{ matrix.os }}-java${{ matrix.java }}
        path: build/reports/tests/test/
    
    - name: Upload coverage reports
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      if: matrix.os == 'ubuntu-latest' && matrix.java == 17
      with:
        name: coverage-report
        path: build/reports/jacoco/test/
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
      if: matrix.os == 'ubuntu-latest' && matrix.java == 17
      with:
        files: ./build/reports/jacoco/test/jacocoTestReport.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  lint:
    name: Lint (detekt)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false

    - name: Set up JDK 17
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6  # v6.0.1
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb  # v6.3.0

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run detekt static analysis
      run: ./gradlew detekt --no-daemon

  android:
    name: Android Keystore module
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
    - name: Set up JDK 17
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6  # v6.0.1
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb  # v6.3.0
    - name: Set up Android SDK
      uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd  # v4.0.4
      with:
        packages: platforms;android-36 build-tools;36.0.0
        accept-android-sdk-licenses: true
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    # JVM fail-closed unit test + lint + AAR. Instrumented tests need an emulator and are run locally
    # (see CHANGELOG); the module is a separate composite build, so the JVM matrix above is untouched.
    - name: Build, unit-test and lint the Android module
      run: ./gradlew -p android build --no-daemon

  audit:
    name: Dependency audit (OSV via CycloneDX SBOM)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false

    - name: Set up JDK 17
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6  # v6.0.1
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb  # v6.3.0

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # Gradle has no committed lockfile; the CycloneDX SBOM (scoped to runtimeClasspath
    # in build.gradle.kts) is the scannable picture of what consumers actually get.
    - name: Generate runtime-scoped SBOM
      run: ./gradlew cyclonedxDirectBom --no-daemon

    - name: OSV scan (runtime dependency graph)
      uses: google/osv-scanner-action/osv-scanner-action@a345acffa64b0eaede81a3d9aae6141214d9c8fc  # v2.6.0
      with:
        scan-args: |-
          -L
          build/reports/cyclonedx-direct/bom.json

  changelog:
    name: changelog entry for version bump
    runs-on: ubuntu-latest

    steps:
    # fetch-depth: 0 — the gate diffs against the base commit, which a shallow
    # checkout would not have.
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false

    # If build.gradle.kts's top-level `version = ` changed relative to the base commit,
    # CHANGELOG.md must carry a matching `## [<version>]` heading. No change → no-op.
    # `^version` is line-anchored, so it matches the project version and not the
    # indented `kotlin("jvm") version "…"` plugin declarations.
    # Convention: docs/SDK-RELEASE-CONVENTIONS.md in the KnishIOClientSDK monorepo.
    - name: CHANGELOG entry for the manifest version bump
      # BASE arrives via env, never interpolated into the shell text (workflow-injection hygiene).
      env:
        BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      run: |
        set -eu
        BASE="${BASE:-}"
        if [ -z "$BASE" ] || [ "$BASE" = '0000000000000000000000000000000000000000' ] \
           || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
          echo "No comparable base commit — changelog gate skipped."; exit 0
        fi
        ver() { sed -n 's/^version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' "$1" | head -1; }
        git show "$BASE:build.gradle.kts" > /tmp/base-manifest 2>/dev/null || : > /tmp/base-manifest
        NEW=$(ver build.gradle.kts); OLD=$(ver /tmp/base-manifest)
        if [ "$NEW" = "$OLD" ]; then echo "version unchanged ($NEW) — nothing to check."; exit 0; fi
        echo "version bumped: ${OLD:-<none>} -> $NEW"
        # index()==1 is a fixed-string match anchored at column 1: no regex escaping of the
        # version, and a deeper `### [x]` heading does NOT satisfy `## [x]` (grep -F would match it).
        if ! awk -v h="## [$NEW]" 'index($0, h) == 1 { f = 1 } END { exit !f }' CHANGELOG.md; then
          echo "::error file=CHANGELOG.md::Version bumped to $NEW but CHANGELOG.md has no '## [$NEW]' entry."
          exit 1
        fi
        echo "OK: CHANGELOG.md documents $NEW"

  build:
    name: Build and Package
    runs-on: ubuntu-latest
    needs: [test, lint, android]
    
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
    
    - name: Set up JDK 17
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6  # v6.0.1
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb  # v6.3.0
    
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    
    - name: Build with Gradle
      run: ./gradlew build --no-daemon
    
    - name: Generate documentation
      run: ./gradlew dokkaGenerate --no-daemon
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: build-artifacts
        path: |
          build/libs/*.jar
          build/dokka/
    
    - name: Validate publication
      run: ./gradlew publishToMavenLocal --no-daemon

  publish-snapshot:
    name: Publish Snapshot
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: build
    
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
    
    - name: Set up JDK 17
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6  # v6.0.1
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb  # v6.3.0
    
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    
    - name: Publish snapshot to Maven Central (Central Portal)
      run: ./gradlew publishToMavenCentral --no-daemon
      env:
        ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
        ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
        ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_IN_MEMORY_KEY_ID }}
        ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}

  publish-release:
    name: Publish Release
    # Tag refs only — a workflow_dispatch is a dry run and must never reach Maven Central.
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    runs-on: ubuntu-latest
    # `version` is a hard dependency, not a courtesy: publishing a tag the manifest does not
    # claim is the failure this pipeline exists to prevent.
    needs: [build, version, android]
    
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
    
    # Release body = this tag's CHANGELOG.md section. Every release page from v0.8.0 through
    # v1.0.0 carried the same content-free placeholder — "See CHANGELOG.md for details." — so
    # the page said nothing about what any given release shipped and forced a reader to go
    # find the right section by hand. The curated CHANGELOG entry is the source of truth;
    # extract it and use it verbatim.
    #
    # This runs BEFORE `./gradlew publishToMavenCentral` on purpose. The empty-section guard
    # below is only useful if it aborts ahead of the irreversible upload; after it, a missing
    # CHANGELOG entry would leave artifacts on Maven Central with no release page at all — the
    # same half-state this step exists to prevent. Extraction needs nothing but the checkout.
    - name: Extract this tag's CHANGELOG section
      run: |
        set -euo pipefail
        # This repo tags with a `v` prefix (v1.0.0) while CHANGELOG headings are bare
        # (## [1.0.0]), so strip it before matching. `version` declares no `outputs:`, so
        # deriving from the ref keeps this self-contained.
        TAG_VERSION="${GITHUB_REF#refs/tags/}"
        TAG_VERSION="${TAG_VERSION#v}"
        awk -v ver="## [$TAG_VERSION]" '
          index($0, ver) == 1 { inside = 1; print; next }
          inside && /^## / { exit }
          inside { print }
        ' CHANGELOG.md > /tmp/release-notes.md
        if [ ! -s /tmp/release-notes.md ]; then
          echo "::error file=CHANGELOG.md::No '## [$TAG_VERSION]' section found — refusing to publish with empty release notes."
          exit 1
        fi
        echo "Release notes for $TAG_VERSION:"
        cat /tmp/release-notes.md

    - name: Set up JDK 17
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6  # v6.0.1
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb  # v6.3.0
    
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Set up Android SDK
      uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd  # v4.0.4
      with:
        packages: platforms;android-36 build-tools;36.0.0
        accept-android-sdk-licenses: true
    
    - name: Publish to Maven Central (Central Portal)
      run: ./gradlew publishToMavenCentral --no-daemon
      env:
        ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
        ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
        ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_IN_MEMORY_KEY_ID }}
        ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}

    - name: Publish Android AAR to Maven Central (Central Portal)
      run: ./gradlew -p android publishToMavenCentral --no-daemon
      env:
        ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
        ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
        ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_IN_MEMORY_KEY_ID }}
        ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}

    - name: Create GitHub Release
      uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3
      with:
        files: |
          build/libs/*.jar
          build/libs/*.jar.asc
        # Was `body:` with a bare link to CHANGELOG.md, which told a reader nothing about the
        # release they were looking at. `generate_release_notes` stays OFF too — the action
        # appends the WHOLE generated block (`<body>\n\n<notes>`), which would add the
        # "bump …(dependabot)" bullets the other SDK pages were reported for. The one part
        # worth keeping was the "Full Changelog" compare link, and synthesizing that needs the
        # previous tag — i.e. fetch-depth: 0 here — which is not worth a full-history clone.
        body_path: /tmp/release-notes.md
        draft: false
        prerelease: ${{ contains(github.ref, '-RC') || contains(github.ref, '-beta') || contains(github.ref, '-alpha') }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}